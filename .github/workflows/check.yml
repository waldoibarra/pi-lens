name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: PI_LENS_EXPECT_VERSION=1.1.0 PATH="$PWD/node_modules/.bin:$PATH" python3 tests/terminal-smoke.py
      - run: npm install --prefix "$RUNNER_TEMP/pi-host" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.2.0
      - run: PI_LENS_EXPECT_VERSION=1.2.0 PATH="$RUNNER_TEMP/pi-host/node_modules/.bin:$PATH" python3 tests/terminal-smoke.py
      - run: npm pack --dry-run
